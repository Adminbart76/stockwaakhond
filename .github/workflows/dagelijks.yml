name: Dagelijkse koersen vastleggen

# Draait elke beursdag na de slotbel in New York, drie keer.
#
# Waarom drie keer, en niet een keer om 21:30 UTC zoals eerst: het venster
# waarin de wisselkoers van die dag opgehaald mag worden, loopt van twintig
# minuten na de slotbel in New York tot middernacht in Londen. In de
# Amerikaanse zomertijd is dat 20.20-23.00 UTC, dus nog geen drie uur. GitHub
# start een geplande taak geregeld later dan gevraagd, en op 7 oktober 2026
# gebeurde dat meteen de eerste keer: gepland om 21:30, gestart om 00:57, en
# toen was het venster dicht.
#
# Met drie tijdstippen is er ruimte voor zo'n vertraging. Een ronde die te
# vroeg is (in de wintertijd is 20:25 nog voor de slotbel) doet gewoon niets
# en eindigt groen; een ronde die alles al vastgelegd aantreft ook. Het script
# controleert zelf of de beurs echt gesloten is.
#
# Dit houdt meteen het gratis Supabase-project wakker. Dat pauzeert na zeven
# dagen zonder activiteit, en dan is het dashboard tijdelijk onbruikbaar.
#
# Geen geheime sleutel hier
# =========================
# Deze taak schrijft met de leessleutel plus een eigen schrijfteken
# (SNAPSHOT_WRITE_TOKEN). Dat teken geeft recht op precies een ding: een
# dagkoers toevoegen van een aandeel dat in de portefeuille zit. De grens zit
# in de database zelf (sql/02_hardening.sql), niet in de goede bedoelingen van
# dit bestand.
#
# De instap van de portefeuille staat hier met opzet NIET meer bij. Die
# schrijft in `executions`, en dat is bewijsmateriaal: niets wat vanuit GitHub
# gebeurt mag daar ooit bij kunnen. De instap doe je lokaal, met het bestand
# "LEG INSTAP VAST (na 22u20).bat".
#
# Er staat geen `|| true` meer achter een stap. Mislukt er iets, dan hoort die
# taak rood te worden. De scripts zelf geven exitcode 0 voor de normale
# situaties waarin er niets te doen is (weekend, feestdag, beurs nog open).

on:
  schedule:
    - cron: "25 20 * * 1-5"   # net na de slotbel in de Amerikaanse zomertijd
    - cron: "25 21 * * 1-5"   # net na de slotbel in de wintertijd
    - cron: "25 22 * * 1-5"   # laatste kans voor het venster in Londen sluit
  workflow_dispatch:        # ook met de hand te starten vanuit GitHub

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakketten installeren
        run: pip install -r requirements.txt

      - name: Wachters draaien
        run: python -m pytest

      - name: Koersen van vandaag vastleggen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SNAPSHOT_WRITE_TOKEN: ${{ secrets.SNAPSHOT_WRITE_TOKEN }}
        run: python scripts/dagelijkse_snapshot.py
